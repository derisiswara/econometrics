# Merender situs Quarto dan menerbitkannya ke GitHub Pages setiap kali ada push ke main.
# Aktifkan di repositori: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Versi action di bawah ini perlu dicek ulang terhadap dokumentasi terbaru sebelum dipakai.
name: Terbitkan situs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
